# Shonan_Lite front web server on port 80.
#
# Shonan_Lite and its PC/phone apps call http://<pluto>/save.php and
# /pluto.php (DATV settings, reboot), which need PHP. maia-httpd (the Maia
# SDR / Tezuka dashboard) used to own port 80; it now listens on
# 127.0.0.1:8000 (see board/tezuka/shonan/post-build.sh) and everything that
# is not a Shonan page is proxied to it, websockets included, so both keep
# their usual URLs.

server.modules = (
	"mod_cgi",
	"mod_proxy",
)

server.document-root = "/www"
server.port          = 80
# Runs as root (no server.username): the PHP pages call fw_setenv and reboot.
server.pid-file      = "/var/run/lighttpd.pid"
server.errorlog      = "/var/log/lighttpd-error.log"
# kbytes; upload.php takes firmware and patch files (php.ini post_max_size = 30M)
server.max-request-size = 30720

include "/etc/lighttpd/conf.d/mime.conf"

# Pages and files of the DATV web UI (board/tezuka/shonan/overlay/www)
$HTTP["url"] =~ "^/([^/]+\.php|Chart\.bundle\.js|config\.txt|fwversion\.txt|releasenote\.txt|settings[^/]*\.txt|img/|lib/|test/)" {
	cgi.assign = ( ".php" => "/usr/bin/php-cgi" )
}
else $HTTP["url"] =~ "" {
	proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8000 ) ) )
	proxy.header = ( "upgrade" => "enable" )
}
